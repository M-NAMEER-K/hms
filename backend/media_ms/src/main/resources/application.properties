spring.application.name=media_ms
server.port=8081
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

MEDIA_NOT_FOUND=Media not found
FILE_EMPTY=File is empty
FILE_SIZE_EXCEEDS_10MB=File size exceeds 10MB
ONLY_JPG_JPEG_PNG_ALLOWED=Only JPG, JPEG and PNG images are allowed
CLOUDINARY_DELETE_FAILED=Failed to delete file from Cloudinary
OLD_MEDIA_NOT_FOUND=old media not found
OLD_IMAGE_DELETE_FAILED=old image not deleted

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true