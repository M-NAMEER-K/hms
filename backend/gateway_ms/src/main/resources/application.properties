spring.application.name=gateway-ms
server.port=9000








frontend.url=${FRONTEND_URL}

eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web=DEBUG


user.service.uri=${USER_SERVICE_URL}
media.service.uri=${MEDIA_SERVICE_URL}
profile.service.uri=${PROFILE_SERVICE_URL}
appointment.service.uri=${APPOINTMENT_SERVICE_URL}
pharmacy.service.uri=${PHARMACY_SERVICE_URL}