spring.application.name=appointment-ms


server.port=8083
profile_ms.url=${PROFILE_MS_URL}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


APPOINTMENT_NOT_FOUND=Appointment not found
APPOINTMENT_ALREADY_CANCELLED=Appointment already cancelled
DOCTOR_NOT_FOUND=Doctor not found
PATIENT_NOT_FOUND=Patient not found
APPOINTMENT_RECORD_ALREADY_EXISTS=Appointment record already exists
APPOINTMENT_RECORD_NOT_FOUND=Appointment record not found
PRESCRIPTION_NOT_FOUND=Prescription not found


eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true










