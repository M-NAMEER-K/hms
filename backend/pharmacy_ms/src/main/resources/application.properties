spring.application.name=pharmacy_ms
server.port=8084

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


MEDICINE_ALREADY_EXISTS=Medicine with same name and dosage already exists
MEDICINE_NOT_FOUND=Medicine not found
MEDICINE_OUT_OF_STOCK=Medicine out of stock

SALE_ALREADY_EXISTS=Sale already exists
SALE_NOT_FOUND=sale not found
SALE_ITEM_NOT_FOUND=sale item not found
INSUFFICIENT_STOCK=insufficient stock