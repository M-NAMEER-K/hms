spring.application.name=payment_ms

server.port=8085


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


eureka.client.service-url.defaultZone=${EUREKA_URL}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}


PAYMENT_NOT_FOUND=Payment not found

PAYMENT_CREATION_FAILED=Unable to create payment order

PAYMENT_VERIFICATION_FAILED=Payment verification failed

PAYMENT_ALREADY_COMPLETED=Payment already completed

INVALID_PAYMENT_SIGNATURE=Invalid payment signature

INVALID_PAYMENT_AMOUNT=Invalid payment amount

INVALID_REFERENCE_ID=Reference Id is required

INVALID_REFERENCE_TYPE=Reference Type is required

INVALID_PAYMENT_REQUEST=Invalid payment request